<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <rect width="128" height="128" fill="black"/>
  
  <!-- Vertical bar of cross -->
  <line x1="64" y1="42" x2="64" y2="114" stroke="white" stroke-width="16" stroke-linecap="round"/>
  
  <!-- Horizontal bar of cross - shorter -->
  <line x1="32" y1="72" x2="96" y2="72" stroke="white" stroke-width="16" stroke-linecap="round"/>
  
  <!-- Three dots above -->
  <!-- Central dot -->
  <circle cx="64" cy="16" r="7" fill="white"/>
  <!-- Left dot -->
  <circle cx="28" cy="26" r="7" fill="white"/>
  <!-- Right dot -->
  <circle cx="100" cy="26" r="7" fill="white"/>
</svg>